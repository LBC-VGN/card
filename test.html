<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mitchell Livieres - La Bella Cucina</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* 1. PREMIUM DESIGN SYSTEMS & HEX CORE */
        :root {
            --bg-dark: #070d12;
            --card-teal: #003840;      /* Deep Luxury Petrol Teal */
            --accent-silver: #F3F4F6;  /* Bright Premium Silver */
            --glass-border: rgba(243, 244, 246, 0.18);
            --font-main: 'Montserrat', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 0% 0%, rgba(0, 56, 64, 0.4) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(10, 20, 30, 0.8) 0px, transparent 50%);
            color: var(--accent-silver);
            font-family: var(--font-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow-x: hidden;
            perspective: 1500px; /* Essential for 3D depth perception */
        }

        /* 2. DYNAMIC NEON BACKGROUND MATRIX EFFECT */
        .bg-particles {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0; left: 0;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            background: linear-gradient(to bottom, rgba(243, 244, 246, 0.15), transparent);
            width: 1px;
            height: 80px;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-100px); opacity: 0; }
            50% { opacity: 0.4; }
            100% { transform: translateY(100vh); opacity: 0; }
        }

        /* 3. THE ULTRA 3D HOLOGRAPHIC CARD CONTROLLER */
        .card-perspective {
            width: 100%;
            max-width: 410px;
            z-index: 2;
            will-change: transform;
        }

        .card {
            background: linear-gradient(145deg, var(--card-teal) 0%, #002429 100%);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 40px 30px;
            box-shadow: 0 40px 80px -15px rgba(0, 0, 0, 0.8);
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out, box-shadow 0.3s ease;
            overflow: hidden;
            
            /* Initial load trigger */
            opacity: 0;
            animation: premiumEntrance 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
        }

        /* Interactive Dynamic Light Flare Overlay */
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(255, 255, 255, 0.18) 0%, transparent 55%);
            pointer-events: none;
            z-index: 5;
            mix-blend-mode: overlay;
        }

        @keyframes premiumEntrance {
            from {
                opacity: 0;
                transform: translateY(60px) rotateX(-15deg);
                box-shadow: 0 0px 0px rgba(0, 0, 0, 0);
            }
            to {
                opacity: 1;
                transform: translateY(0) rotateX(0deg);
            }
        }

        /* 4. CONTENT SECTIONS WITH VARIABLE Z-INDEX DEPTH */
        .brand-header {
            text-align: center;
            margin-bottom: 30px;
            transform: translateZ(40px); /* Pushes logo forward in 3D space */
            transition: transform 0.3s ease;
        }

        .brand-header img {
            max-height: 45px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
        }

        .main-identity {
            text-align: center;
            margin-bottom: 35px;
            transform: translateZ(60px); /* Pushes text even higher */
        }

        .user-name {
            font-size: 28px;
            font-weight: 700;
            color: var(--accent-silver);
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            text-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }

        .user-title {
            font-size: 13px;
            font-weight: 400;
            color: rgba(243, 244, 246, 0.65);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 25px;
        }

        /* Glow Matrix QR Frame */
        .qr-container {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(243, 244, 246, 0.12);
            padding: 16px;
            border-radius: 24px;
            display: inline-block;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.3), 0 15px 35px rgba(0,0,0,0.4);
            position: relative;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .qr-container::after {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            border-radius: 24px;
            background: linear-gradient(135deg, var(--accent-silver), transparent, var(--card-teal));
            z-index: -1;
            opacity: 0.4;
        }

        #qr {
            display: block;
            mix-blend-mode: lighten;
            filter: drop-shadow(0 0 4px rgba(243, 244, 246, 0.3));
        }

        .qr-caption {
            font-size: 11px;
            color: rgba(243, 244, 246, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 12px;
        }

        /* 5. INTERACTIVE TACTILE CONTACT INTERFACES */
        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 14px;
            transform: translateZ(35px);
        }

        .info-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(243, 244, 246, 0.06);
            border-radius: 18px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .info-item svg {
            width: 22px;
            height: 22px;
            fill: var(--accent-silver);
            opacity: 0.7;
            transition: all 0.3s ease;
            z-index: 2;
        }

        .info-item a {
            color: var(--accent-silver);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: -0.2px;
            z-index: 2;
            transition: transform 0.3s ease;
            display: inline-block;
        }

        /* High-End Micro-Interactions on Hover */
        .info-item::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(243, 244, 246, 0.06), transparent);
            transition: all 0.6s ease;
            z-index: 1;
        }

        .info-item:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(243, 244, 246, 0.25);
            transform: translateX(6px) translateZ(10px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .info-item:hover ::before {
            left: 100%;
        }

        .info-item:hover svg {
            opacity: 1;
            transform: scale(1.18) rotate(-4deg);
        }

        .info-item:hover a {
            transform: translateX(2px);
        }

        .info-item:active {
            transform: translateX(2px) scale(0.98);
        }

        /* Staggered entrance animations for items */
        .stagger-1 { animation: itemFade 0.6s ease custom-delay; }

    </style>
</head>
<body>

    <!-- Keep external scripting call perfectly attached -->
    <script src="script.js"></script>

    <script>
        /* 1. MATH MATRICES FOR THE 3D PARALLAX GYRO TILT EFFECT */
        const wrapper = document.getElementById('perspective-wrapper');
        const card = document.getElementById('tilt-card');

        function applyTilt(clientX, clientY) {
            const rect = card.getBoundingClientRect();
            const x = clientX - rect.left;
            const y = clientY - rect.top;

            const centerX = rect.width / 2;
            const centerY = rect.height / 2;

            // Compute precision angle orientation (Limit output rotation to 14 degrees)
            const rotateX = ((centerY - y) / centerY) * 14;
            const rotateY = ((x - centerX) / centerX) * -14;

            card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
            card.style.setProperty('--mouse-x', `${(x / rect.width) * 100}%`);
            card.style.setProperty('--mouse-y', `${(y / rect.height) * 100}%`);
        }

        // Desktop Pointer Calculation tracking
        wrapper.addEventListener('mousemove', (e) => {
            requestAnimationFrame(() => applyTilt(e.clientX, e.clientY));
        });

        // Smooth orientation structural return on mouse exit
        wrapper.addEventListener('mouseleave', () => {
            card.style.transition = 'transform 0.5s cubic-bezier(0.16, 1, 0.3, 1)';
            card.style.transform = 'rotateX(0deg) rotateY(0deg)';
            card.style.setProperty('--mouse-x', '50%');
            card.style.setProperty('--mouse-y', '50%');
        });

        wrapper.addEventListener('mouseenter', () => {
            card.style.transition = 'transform 0.08s ease-out';
        });

        /* 2. DYNAMIC MOBILE ACCELEROMETER GYRO-EMULATION TILT */
        if (window.DeviceOrientationEvent) {
            window.addEventListener('deviceorientation', (e) => {
                // Emulate cursor coordinates based on mobile tilt parameters (gamma/beta)
                if (e.gamma === null || e.beta === null) return;
                
                // Map normal handling parameters safely
                const extX = Math.min(Math.max(e.gamma, -20), 20); // range limit
                const extY = Math.min(Math.max(e.beta, 15), 55);

                const rotateY = (extX / 20) * 12;
                const rotateX = ((extY - 35) / 20) * -12;

                requestAnimationFrame(() => {
                    card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
                    card.style.setProperty('--mouse-x', `${50 + (extX * 2.5)}%`);
                    card.style.setProperty('--mouse-y', `${50 + ((extY - 35) * 2.5)}%`);
                });
            });
        }

        /* 3. GENERATE THE FLOATING BACKGROUND PARTICLE GRID */
        const field = document.getElementById('particle-field');
        const count = 22;

        for (let i = 0; i < count; i++) {
            const p = document.createElement('div');
            p.classList.add('particle');
            p.style.left = `${Math.random() * 100}%`;
            p.style.top = `${Math.random() * 100}%`;
            p.style.animationDuration = `${5 + Math.random() * 7}s`;
            p.style.animationDelay = `${Math.random() * -10}s`;
            field.appendChild(p);
        }
    </script>
</body>
