<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mitchell Livieres - La Bella Cucina</title>
    <!-- Generador de QR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <!-- Tipografía Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; }
        
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #032127; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        
        .card {
            background-color: #003840; 
            border-radius: 25px;
            /* REDUCIMOS EL MARGEN INFERIOR (De 30px a 20px) */
            padding: 30px 20px 20px 20px;
            width: 100%;
            max-width: 300px; 
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            border: 2px solid #d4af37;
        }
        
        /* LOGO SUPERIOR */
        .brand-header {
            width: 100%;
            margin-bottom: 50px; 
            display: flex;
            justify-content: center;
        }
        
        .brand-header img {
            width: 180px;
            height: auto;
        }
        
        /* BLOQUE CENTRAL: NOMBRE + CARGO + QR */
        .main-identity {
            margin-bottom: 30px;
        }
        
        .user-name {
            font-size: 18px; 
            font-weight: 500;
            color: #ffffff;
            margin: 0 0 5px 0;
            letter-spacing: 0.8px;
        }
        
        .user-title {
            font-size: 10px;
            color: #799a9f; 
            margin: 0 0 15px 0;
            text-transform: uppercase;
            letter-spacing: 1.2px;
        }
        
        .qr-container {
            display: inline-block;
            line-height: 0;
            border-radius: 12px;
            border: 2px solid #d4af37;
            overflow: hidden;
        }
        
        #qr {
            display: block;
        }
        
        .qr-caption {
            font-size: 10px;
            color: #799a9f;
            margin-top: 10px;
        }
        
        /* CONTACTO INFERIOR */
        .contact-info {
            text-align: left;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 20px;
            margin-top: 20px;
        }
        
        .info-item {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            font-size: 11.5px; 
            color: #e6eded;
        }

        /* ELIMINAMOS EL MARGEN DEL ÚLTIMO ÍTEM PARA PEGARLO AL FONDO */
        .info-item:last-child {
            margin-bottom: 5px;
        }
        
        .info-item svg {
            width: 16px;
            height: 16px;
            fill: #d4af37;
            margin-right: 12px;
            flex-shrink: 0; 
        }
        
        .info-item a {
            color: inherit;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="brand-header">
            <img src="logo-corporativo.png" alt="Logo">
        </div>
        
        <div class="main-identity">
            <h1 class="user-name">Mitchell Livieres</h1>
            <p class="user-title">Foreign Trade & IT Manager</p>
            
            <div class="qr-container">
                <canvas id="qr"></canvas>
            </div>
            <p class="qr-caption">Escanea para agendar</p>
        </div>

                <a href="tel:+595985496809">+595 985 496809</a>
            </div>
            <div class="info-item">
                <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                <a href="mailto:mitchell@LBC.com.py">mitchell@LBC.com.py</a>
            </div>
            <div class="info-item">
                <svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.051.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 1 0 0 12.324 6.162 6.162 0 0 0 0-12.324zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.406-11.845a1.44 1.44 0 1 0 0 2.881 1.44 1.44 0 0 0 0-2.881z"/></svg>
                <a href="https://www.instagram.com/labellacucinapy/" target="_blank">@labellacucinapy</a>
            </div>
            <div class="info-item">
                <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                <a href="https://maps.google.com/?q=La+Bella+Cucina+Avda+Sacramento+975+Asuncion" target="_blank">Avda. Sacramento 975, Asunción</a>
            </div>
        </div>
    </div>

    <script>
        const vcard = "BEGIN:VCARD\nVERSION:3.0\nFN:Mitchell Livieres\nORG:La Bella Cucina\nTEL:+595985496809\nEMAIL:mitchell@LBC.com.py\nEND:VCARD";
        new QRious({
            element: document.getElementById('qr'),
            size: 160,
            background: '#003840',
            foreground: '#d4af37',
            level: 'M',
            value: vcard
        });
    </script>
</body>
</html>
