<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carlos René Virgona - La Bella Cucina</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

<div class="card">
        <div class="brand-header">
            <img src="logo-corporativo.png" alt="Logo">
        </div>
        
        <div class="main-identity">
            <!-- 1. CAMBIA EL NOMBRE (Mantené el id="txt-nombre") -->
            <h1 class="user-name" id="txt-nombre">Marianela Virgona</h1>
            
            <!-- 2. CAMBIA EL CARGO (Mantené el id="txt-cargo") -->
            <p class="user-title" id="txt-cargo">Directora</p>
            
            <div class="qr-container">
                <canvas id="qr"></canvas>
            </div>
            <p class="qr-caption">Escanea para agendar</p>
        </div>
        
        <div class="contact-info">
            <div class="info-item">
                <svg viewBox="0 0 24 24"><!-- Icono teléfono --></svg>
                <!-- 3. CAMBIA EL TELÉFONO (Mantené el id="link-tel" y el formato) -->
                <a href="tel:+595971471386" id="link-tel">+595 971 471386</a>
            </div>
            
            <div class="info-item">
                <svg viewBox="0 0 24 24"><!-- Icono mail --></svg>
                <!-- 4. CAMBIA EL CORREO (Mantené el id="link-mail") -->
                <a href="mailto:marianela@LBC.com.py" id="link-mail">marianela@LBC.com.py</a>
            </div>
            
            <!-- Los links de Instagram y Mapa quedan igual para todos si es la misma empresa -->
            <div class="info-item">
                <svg viewBox="0 0 24 24"><!-- Icono Insta --></svg>
                <a href="https://www.instagram.com/labellacucinapy/" target="_blank">@labellacucinapy</a>
            </div>
            <div class="info-item">
                <svg viewBox="0 0 24 24"><!-- Icono Mapa --></svg>
                <a href="https://maps.google.com/?q=La+Bella+Cucina+Avda+Sacramento+975+Asuncion" target="_blank">Avda. Sacramento 975, Asunción</a>
            </div>
        </div>
    </div>

    <!-- El script mágico que hace todo el trabajo pesado -->
    <script src="script.js"></script>
</body>
</html>
